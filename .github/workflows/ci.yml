name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install quality tools
        run: python -m pip install ruff==0.16.5

      - name: Compile
        run: >-
          python -m compileall -q
          skills/codex-native-scheduler/scripts

      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Validate skill
        run: python scripts/validate_skill.py

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Task Scheduler live registration canary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP "codex-native-scheduler-state"
          $entry = "skills/codex-native-scheduler/scripts/codex-schedule"
          $fakeCodex = (Resolve-Path "tests/fixtures/fake-codex.cmd").Path
          python $entry --state-dir $state create `
            --backend task-scheduler `
            --name windows-ci-canary `
            --cwd $PWD `
            --allow-dirty `
            --at 2h `
            --codex-path $fakeCodex `
            --prompt "CI registration canary; do not run."
          python $entry --state-dir $state status windows-ci-canary
          python $entry --state-dir $state delete windows-ci-canary --yes
